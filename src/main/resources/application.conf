akka {
  loglevel = "INFO"
}

# Akka Java SDK Configuration
# Note: License key is required if using ComponentClient/Agent components
# Get a free key at: https://akka.io/key
# Set via environment variable: AKKA_JAVASDK_LICENSE_KEY
# Or uncomment and set below:
# akka.javasdk.license-key = ${?AKKA_JAVASDK_LICENSE_KEY}

akka.javasdk {
  # License key for Akka Java SDK (required if using ComponentClient)AKKA_JAVASDK_LICENSE_KEY
  # Get free key at: https://akka.io/key
  license-key = <<your akka sdk license key>>
  
  agent {
    # Specific configuration for OpenAI Extraction Agent
    openai-agent {
      model-provider = openai
      model-name = "gpt-4o"
      api-key = ${?OPENAI_API_KEY}
      base-url = "https://api.openai.com/v1"
    }
    
    # Specific configuration for Claude Extraction Agent
    claude-agent {
      model-provider = claude
      model-name = "claude-sonnet-4-20250514"
      api-key = ${?ANTHROPIC_API_KEY}
      base-url = "https://api.anthropic.com/v1"
    }

    # Legacy/Default config (kept for reference or fallback)
    openai {
      model-name = "gpt-4o"
      api-key = ${?OPENAI_API_KEY}
      base-url = "https://api.openai.com/v1"
    }
    
    claude {
      model-name = "claude-sonnet-4-20250514"
      api-key = ${?ANTHROPIC_API_KEY}
      base-url = "https://api.anthropic.com/v1"
    }
  }
}

http {
  host = "0.0.0.0"
  port = 8080
}

# Legacy configuration (kept for backward compatibility if needed)
openai {
  baseUrl = "https://api.openai.com/v1"
  model = "gpt-4o"
  # API key should be set via OPENAI_API_KEY environment variable
  # Do not commit API keys to version control
}
claude {
  baseUrl = "https://api.anthropic.com/v1"
  model = "claude-sonnet-4-20250514"
  # API key should be set via ANTHROPIC_API_KEY environment variable
  # Do not commit API keys to version control
}
akka.http.server.parsing.max-content-length = 64m
akka.http.server.parsing.max-to-strict-bytes = 64m
# Increased timeouts to accommodate AI processing (OpenAI can take up to 15 minutes)
# request-timeout: Maximum time the server will wait for a request entity to be received
akka.http.server.request-timeout = 20m
# idle-timeout: Maximum time a connection can be idle before being closed
akka.http.server.idle-timeout = 20m
# Timeout for binding operations
akka.http.server.bind-timeout = 10s

